<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What's for Lunch?</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<script>
  // Cache-bust on every page load so edits to style.css/app.js always show
  // up immediately -- otherwise browsers (mobile Safari especially) can
  // hang onto stale copies of these for a long time, requiring a private
  // tab or manual cache-clear to see updates.
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>
<header>
  <div>
    <h1 id="appTitle">🦅 What's for Lunch?</h1>
    <div class="sub" id="schoolLabel">Loading…</div>
  </div>
  <button id="refreshBtn">🔄 Refresh &amp; Publish</button>
</header>

<nav class="tab-bar" id="tabBar">
  <button class="tab-btn" data-tab="uhills">U Hills</button>
  <button class="tab-btn" data-tab="prek">Pre-K</button>
</nav>

<div class="day-nav">
  <button id="prevDay" aria-label="Previous day">&#8592;</button>
  <div id="dayLabel">Loading…</div>
  <button id="nextDay" aria-label="Next day">&#8594;</button>
</div>

<main id="main">
  <div class="empty-state"><div class="big">🍽️</div>Loading menu…</div>
</main>

<div id="toast"></div>

<script>
  document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
